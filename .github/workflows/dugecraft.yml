name: DugeCraft

on:
  push:
    paths:
      - 'dugecraft/**'
      - '.github/workflows/dugecraft.yml'
  pull_request:
    paths:
      - 'dugecraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dugecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: dugecraft/pom.xml
      - run: mvn -B -U package
      - uses: actions/upload-artifact@v4
        with:
          name: DugeCraft
          path: dugecraft/target/DugeCraft-*.jar
