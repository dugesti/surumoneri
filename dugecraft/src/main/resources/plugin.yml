name: DugeCraft
version: '${project.version}'
main: tr.dugecraft.DugeCraft
api-version: '1.21'
folia-supported: true
description: DugeCraft claim, sok kulesi ve chunk blok limit sistemi (Skript'ten tasindi)
softdepend: [Skript, Vault, EconomyShopGUI]

permissions:
  dugecraft.lagwarn:
    description: Lag uyarilarini gorur, /bloklag kullanir
    default: op
  dugecraft.admin:
    description: /dugecraft durum komutu
    default: op

commands:
  dugecraft:
    description: DugeCraft modul durumunu gosterir (hangi sistem acik, neden kapali)
    permission: dugecraft.admin
