name: DugeCraft
version: '${project.version}'
main: tr.dugecraft.DugeCraft
api-version: '1.21'
folia-supported: true
description: DugeCraft claim, sok kulesi ve chunk blok limit sistemi (Skript'ten tasindi)
softdepend: [Skript, Vault, EconomyShopGUI]

commands:
  bloklag:
    description: bloksinir skriptinin son 1 dakikalık yükünü ve sunucu durumunu gösterir
  chunkhesapla:
    description: Bulunduğun chunk'ı baştan sona yeniden sayar
  chunklimit:
    description: Kayıtlı sayaçları gösterir (tarama yapmaz)
  chunklimittemizle:
    description: Tarama önbelleğini sıfırlar (WorldEdit vb. sonrası)
  chunklimitkaydet:
    description: Limit verilerini diske hemen yazar

permissions:
  dugecraft.lagwarn:
    description: Lag uyarilarini gorur, /bloklag kullanir
    default: op
